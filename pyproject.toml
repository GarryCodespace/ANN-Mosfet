[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-mosfet-spice"
version = "0.1.0"
description = "ANN surrogate modelling workflow for MOSFET SPICE model extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["mosfet_ann*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
